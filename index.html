<!DOCTYPE html>
<html>
<head>
  <title>synisul</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      transition: opacity 0.6s ease;
    }
    #text {
      font-size: 28px;
      margin-bottom: 30px;
      text-align: center;
      min-height: 60px;
    }
    #enter {
      opacity: 0;
      padding: 12px 30px;
      border: 1px solid white;
      background: transparent;
      color: white;
      cursor: pointer;
      transition: 0.3s;
      font-family: monospace;
      font-size: 16px;
    }
    #enter:hover { background: white; color: black; }
    .enter-clicked { animation: enterPop 0.35s ease; }
    @keyframes enterPop {
      0% { transform: scale(1); }
      40% { transform: scale(0.85); }
      70% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    #landing {
      display: none;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    #logo { width: 90vw; max-width: 900px; margin-bottom: 8px; }
    #icons { display: flex; gap: 30px; }
    .icon { font-size: 35px; color: white; cursor: pointer; transition: 0.2s; text-decoration: none; }
    .icon:hover { transform: scale(1.2); opacity: 0.7; }
    .clicked { animation: pop 0.3s ease; }
    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.4); }
      100% { transform: scale(1); }
    }
  </style>
</head>

<script>
  const textEl = document.getElementById("text");
  const enterBtn = document.getElementById("enter");
  const landing = document.getElementById("landing");

  let base = 1000;
  let visits = localStorage.getItem("fakeVisits");
  if (!visits) { visits = base + Math.floor(Math.random() * 500); }
  else { visits = parseInt(visits); }
  visits++;
  localStorage.setItem("fakeVisits", visits);

  const lines = ["welcome...", `you are the #${visits}th visitor`];
  let lineIndex = 0, charIndex = 0;

  const AudioContext = window.AudioContext || window.webkitAudioContext;
  const audioCtx = new AudioContext();

  function playTypeSound() {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "square"; osc.frequency.value = 700;
    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.03);
  }

  function typeEffect() {
    if (lineIndex < lines.length) {
      if (charIndex < lines[lineIndex].length) {
        textEl.innerHTML += lines[lineIndex].charAt(charIndex);
        if (lineIndex === 0) { try { audioCtx.resume(); playTypeSound(); } catch(e){} }
        charIndex++;
        setTimeout(typeEffect, 50);
      } else {
        textEl.innerHTML += "<br>"; lineIndex++; charIndex = 0;
        setTimeout(typeEffect, 400);
      }
    } else { enterBtn.style.opacity = 1; }
  }
  typeEffect();

  enterBtn.addEventListener("click", () => {
    enterBtn.classList.add("enter-clicked");
    document.body.style.opacity = "0";
    setTimeout(() => {
      textEl.style.display = "none";
      enterBtn.style.display = "none";
      landing.style.display = "flex";
      setTimeout(() => { document.body.style.opacity = "1"; landing.style.opacity = "1"; }, 50);
    }, 500);
  });

  document.querySelectorAll(".icon").forEach(icon => {
    icon.addEventListener("click", () => {
      icon.classList.add("clicked");
      setTimeout(() => icon.classList.remove("clicked"), 300);
    });
  });
</script>
</body>
</html>
